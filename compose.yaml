services:
  # Node.js service (use with: docker compose up nextjs-standalone --build)
  nextjs-standalone:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-standalone-image
    container_name: nextjs-standalone-container
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped
    secrets:
      - SUPABASE_URL
      - SUPABASE_PUBLISHABLE_KEY

secrets:
  SUPABASE_URL:
    file: ./.secrets/SUPABASE_URL.txt
  SUPABASE_PUBLISHABLE_KEY:
    file: ./.secrets/SUPABASE_PUBLISHABLE_KEY.txt
  SUPABASE_ID:
    file: ./.secrets/SUPABASE_ID.txt
